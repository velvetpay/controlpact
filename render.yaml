services:
  - type: web
    name: controlpact-api
    runtime: node
    plan: free
    branch: main
    autoDeployTrigger: off
    buildCommand: npm ci && npm run build:api
    startCommand: node apps/api/dist/server.js
    envVars:
      - key: CONTROLPACT_STORAGE
        value: mongodb
      - key: CONTROLPACT_MONGODB_DB
        value: controlpact
      - key: CONTROLPACT_PUBLIC_WEB_URL
        value: https://controlpact.com
      - key: CONTROLPACT_INVITE_FROM_EMAIL
        value: ControlPact <welcome@velvetpay.app>
      - key: HOST
        value: 0.0.0.0
      - key: CONTROLPACT_MONGODB_URI
        sync: false
      - key: CONTROLPACT_RECEIPT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
